name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Сборка Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v7

      - name: Настроить Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Собрать проект через Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: SAST — SpotBugs и Find Security Bugs
        id: sast
        run: mvn --batch-mode --no-transfer-progress spotbugs:check

      - name: Сохранить отчёт SAST
        if: ${{ !cancelled() && steps.sast.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: sast-spotbugs
          path: target/spotbugsXml.xml
          if-no-files-found: error